---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-singboxoperator-shlande-top-v1alpha1-externaloutbound
  failurePolicy: Fail
  name: vexternaloutbound-v1alpha1.kb.io
  rules:
  - apiGroups:
    - singboxoperator.shlande.top
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - externaloutbounds
  sideEffects: None
