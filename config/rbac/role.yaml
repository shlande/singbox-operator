---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - singboxoperator.shlande.top
  resources:
  - externaloutbounds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - singboxoperator.shlande.top
  resources:
  - externaloutbounds/finalizers
  verbs:
  - update
- apiGroups:
  - singboxoperator.shlande.top
  resources:
  - externaloutbounds/status
  verbs:
  - get
  - patch
  - update
